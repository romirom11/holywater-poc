# Pipeline configuration. Every model, threshold and retry policy lives here; secrets live in .env.
version: 1

llm:
  model: "anthropic/claude-sonnet-5.5"       # any OpenRouter model id with structured outputs
  temperature: 0.7
  max_attempts: 3                              # retries on invalid schema / line-substring violation

judge:                                         # TypeSafe Jev; disabled or no key -> NoopJudge
  enabled: true
  model: "jev-latest"
  preflight:
    enabled: true
    safety_risk_threshold: 0.7                 # Noul p > threshold -> rewrite prompt before generation
    min_filmability_score: 3                   # Score 1..5 below -> retry LLM with feedback
  failure_classifier:
    enabled: true

video:
  provider: fal
  model: "bytedance/seedance-2.5/text-to-video"
  resolution: "480p"                           # 480p for dev iterations, 720p for final samples
  aspect_ratio: "9:16"
  generate_audio: true
  max_attempts: 2

audio:
  strategy: native                             # native | tts_overlay
  native_attempts: 2                           # native tries per shot before falling back to TTS
  tts:
    model: "fal-ai/elevenlabs/tts/eleven-v3"
    voice: "Rachel"
  lipsync:
    enabled: false
    model: "fal-ai/sync-lipsync/v2"
  stt:
    model: "fal-ai/whisper"
    language: auto

quality:
  max_wer: 0.10
  duration_s: {min: 8, max: 30}
  shots: {min: 1, max: 2}

retries:
  provider: {attempts: 3, backoff_s: [5, 15, 45]}
  timeouts_s: {llm: 60, video: 600, tts: 60, stt: 120, judge: 10}

hitl:                                          # documented HITL points; all disabled in the PoC
  after_script: {enabled: false}
  on_unverified_speech: {enabled: false}

storage:
  runs_dir: "runs"
  db_path: "runs/holywater.db"
  final_name: "final.mp4"
